<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <rect x="0" y="0" width="1000" height="1000" rx="200" fill="#1a1a2e"/>

  <!-- Clipboard -->
  <rect x="280" y="220" width="440" height="600" rx="44" fill="#ffffff"/>
  <rect x="400" y="150" width="200" height="120" rx="32" fill="#d1d5db"/>

  <!-- Checklist rows -->
