  <polyline points="354,342 367,356 392,326" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="432" y="320" width="230" height="40" rx="20" fill="#e5e7eb"/>

  <rect x="340" y="438" width="64" height="64" rx="14" fill="#e5e7eb"/>
